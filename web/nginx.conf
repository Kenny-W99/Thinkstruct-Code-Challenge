server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API (and its interactive docs) live in the api container.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;  # phase-2 reranking takes a few seconds on CPU
    }
    location = /docs         { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }

    # Hashed build files never change, so browsers may cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app: unknown paths get index.html.
    location / {
        try_files $uri /index.html;
    }
}
